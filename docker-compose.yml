# Forge — full stack (default)
# Usage:
#   docker compose up -d --build          # API + frontend + Postgres + Redis
#   docker compose --profile obs up -d    # + Prometheus
#   docker compose --profile dev up -d    # Hot-reload dev (postgres/redis + api-dev + web-dev)

name: forge

services:
  postgres:
    image: postgres:15-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: forge_dev
    ports:
      - "5432:5432"
    volumes:
      - forge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: forge-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/forge_dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      REFRESH_EXPIRY: ${REFRESH_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 3001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      DATADOG_API_KEY: ${DATADOG_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: forge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # Hot-reload development (profile: dev)
  api-dev:
    profiles: [dev]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: forge-api-dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/forge_dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret}
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
      PORT: 3001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    depends_on:
      postgres:
        condition: service_healthy

  web-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: forge-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - forge_web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      - api-dev

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.2.1
    container_name: forge-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  # Stripe CLI — forward webhooks to API (profile: stripe)
  stripe-cli:
    profiles: [stripe]
    image: stripe/stripe-cli:latest
    container_name: forge-stripe-cli
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: listen --forward-to http://api:3001/api/billing/webhook
    depends_on:
      api:
        condition: service_healthy

volumes:
  forge_pg:
  forge_web_node_modules:
