services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: forge_dev
    ports:
      - "5432:5432"
    volumes:
      - forge_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/forge_dev
      JWT_SECRET: dev-secret
      REFRESH_SECRET: dev-refresh-secret
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
    depends_on:
      - postgres

volumes:
  forge_pg:
